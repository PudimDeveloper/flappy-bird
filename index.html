<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
    <title>Retro Flappy Bird</title>
    <script src="https://cdn.tailwindcss.com">
    <link rel="icon" href="favicon.png">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', monospace;
            touch-action: manipulation;
        }
        
        canvas {
            image-rendering: pixelated;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center overflow-hidden p-2 text-white selection:bg-yellow-500">

    <!-- Game Container -->
    <div class="relative flex flex-col items-center max-w-full">
        <!-- Header -->
        <div class="mb-4 text-center">
            <h1 class="text-2xl md:text-3xl font-bold tracking-wider text-yellow-400 drop-shadow-[0_4px_0_rgba(0,0,0,1)] flex items-center justify-center gap-2">
                <span>FLAPPY</span>
                <span class="text-rose-500">BIRD</span>
            </h1>
            <p class="text-[8px] md:text-[10px] text-slate-400 mt-2 tracking-wide">PRESS SPACE OR TAP TO FLY</p>
        </div>

        <!-- Canvas and UI Overlays -->
        <div class="relative border-4 border-slate-700 rounded-lg overflow-hidden bg-sky-300">
            <!-- Game Canvas -->
            <canvas id="gameCanvas" width="400" height="550" class="w-full max-w-[400px] h-auto aspect-[400/550] block"></canvas>

            <!-- Sound Toggle Button -->
            <button id="soundToggle" class="absolute top-3 right-3 z-20 bg-slate-800/80 hover:bg-slate-700 border-2 border-white p-2 rounded text-xs transition duration-150">
                🔊
            </button>

            <!-- Start Screen Overlay -->
            <div id="startScreen" class="absolute inset-0 bg-black/60 z-10 flex flex-col items-center justify-center p-4 text-center transition-opacity duration-300">
                <div class="animate-bounce mb-6">
                    <!-- Retro Yellow Bird representation -->
                    <div class="w-16 h-12 bg-yellow-400 border-4 border-black rounded-full relative mx-auto">
                        <div class="absolute right-1 top-2 w-3 h-3 bg-white border-2 border-black rounded-full flex items-center justify-center">
                            <div class="w-1 h-1 bg-black rounded-full"></div>
                        </div>
                        <div class="absolute -right-2 top-4 w-5 h-3 bg-orange-500 border-2 border-black rounded-lg"></div>
                        <div class="absolute left-1 top-4 w-6 h-4 bg-white/70 border-2 border-black rounded-full origin-right animate-pulse"></div>
                    </div>
                </div>
                <h2 class="text-lg text-yellow-300 mb-2 drop-shadow-[0_2px_0_rgba(0,0,0,1)]">READY?</h2>
                <p class="text-[10px] text-white leading-relaxed mb-6 max-w-[280px]">TAP THE SCREEN OR PRESS <span class="text-green-400">SPACEBAR</span> TO JUMP</p>
                <button id="playBtn" class="bg-green-500 hover:bg-green-400 border-b-4 border-green-700 hover:border-green-500 text-white px-6 py-3 rounded text-xs tracking-wider transition-all transform active:scale-95">
                    START PLAYING
                </button>
            </div>

            <!-- Game Over Screen Overlay -->
            <div id="gameOverScreen" class="absolute inset-0 bg-black/75 z-10 hidden flex flex-col items-center justify-center p-4 text-center">
                <h2 class="text-xl text-rose-500 mb-2 drop-shadow-[0_2px_0_rgba(0,0,0,1)] animate-pulse">GAME OVER</h2>
                
                <div class="bg-slate-800/90 border-4 border-slate-600 rounded-lg p-4 my-4 w-64 text-left shadow-2xl">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-[9px] text-slate-400">SCORE:</span>
                        <span id="finalScore" class="text-base text-yellow-300 font-bold">0</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-[9px] text-slate-400">BEST SCORE:</span>
                        <span id="highScore" class="text-base text-green-400 font-bold">0</span>
                    </div>
                </div>

                <button id="restartBtn" class="bg-yellow-500 hover:bg-yellow-400 border-b-4 border-yellow-700 hover:border-yellow-500 text-slate-900 px-6 py-3 rounded text-xs tracking-wider transition-all transform active:scale-95">
                    PLAY AGAIN
                </button>
            </div>
        </div>

        <!-- Controls Guide -->
        <div class="mt-4 flex gap-4 text-[8px] text-slate-500">
            <span>[SPACE] / Tap to Fly</span>
            <span>Avoid Green Pipes</span>
        </div>
    </div>

    <script>
        // Game Engine Variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Screen Overlays
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const playBtn = document.getElementById('playBtn');
        const restartBtn = document.getElementById('restartBtn');
        const finalScoreLabel = document.getElementById('finalScore');
        const highScoreLabel = document.getElementById('highScore');
        const soundToggle = document.getElementById('soundToggle');

        // Physics Configurations
        const GRAVITY = 0.35;
        const JUMP = -6.2;
        const PIPE_SPEED = 2.2;
        const PIPE_SPAWN_INTERVAL = 110; // Frames before spawning a new pipe
        const PIPE_GAP = 130;            // Open clearance space for the bird to fly through
        const MIN_PIPE_HEIGHT = 50;

        // Sound System (Synthesizer via Web Audio API)
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            
            if (type === 'jump') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.12);
                
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.12);
            } 
            else if (type === 'score') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } 
            else if (type === 'hit') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(60, now + 0.3);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            }
        }

        // Toggle Sound State
        soundToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            soundEnabled = !soundEnabled;
            soundToggle.innerText = soundEnabled ? '🔊' : '🔇';
        });

        // Game State Engine variables
        let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
        let score = 0;
        let highscore = parseInt(localStorage.getItem('flappy_highscore')) || 0;

        // Player (Bird) Object Properties
        const bird = {
            x: 80,
            y: 200,
            width: 34,
            height: 24,
            velocity: 0,
            rotation: 0,
            frame: 0,
            animationSpeed: 0.15,
            jump() {
                this.velocity = JUMP;
                playSound('jump');
                // Spawn cute feather particles
                createJumpParticles(this.x, this.y);
            },
            update() {
                this.velocity += GRAVITY;
                this.y += this.velocity;
                this.frame += this.animationSpeed;

                // Stop bird from exceeding ceiling
                if (this.y < 0) {
                    this.y = 0;
                    this.velocity = 0;
                }

                // Smooth rotation angle based on falling rate
                this.rotation = Math.min(Math.max(this.velocity * 0.07, -0.4), 0.8);
            },
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Flapping wings sine-wave cycle offset
                const flapOffset = Math.sin(this.frame) * 4;

                // Black Outer Outline
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();

                // Yellow Main Body
                ctx.fillStyle = '#facc15';
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fill();

                // Soft Orange shadow belly
                ctx.fillStyle = '#eab308';
                ctx.beginPath();
                ctx.arc(-2, 4, 10, 0, Math.PI * 2);
                ctx.fill();

                // Eye
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(6, -4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(7, -4, 2, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                ctx.fillStyle = '#f97316';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(11, -2);
                ctx.lineTo(21, 1);
                ctx.lineTo(10, 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Animated Wing
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 2.5;
                ctx.save();
                ctx.translate(-6, flapOffset);
                ctx.beginPath();
                ctx.ellipse(-2, 0, 7, 10, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                ctx.restore();
            }
        };

        // Obstacles (Pipes) Container
        let pipes = [];
        let frameCounter = 0;

        class Pipe {
            constructor() {
                this.x = canvas.width;
                // Generate relative random heights keeping the exact standard gap distance
                const totalHeightAvailable = canvas.height - 110 - PIPE_GAP; // 110 is Ground offset height
                this.topHeight = Math.floor(Math.random() * (totalHeightAvailable - MIN_PIPE_HEIGHT * 2)) + MIN_PIPE_HEIGHT;
                this.bottomHeight = totalHeightAvailable - this.topHeight;
                this.width = 62;
                this.passed = false;
            }

            update() {
                this.x -= PIPE_SPEED;
            }

            draw() {
                // Pipe Retro Style Colors
                const mainColor = '#16a34a'; // Emerald Green
                const highlightColor = '#4ade80'; // Accent Bright Green
                const darkColor = '#15803d'; // Shadow Dark Green
                const lipHeight = 22;

                // 1. Draw Upper Pipe
                ctx.fillStyle = mainColor;
                ctx.fillRect(this.x, 0, this.width, this.topHeight - lipHeight);
                // Shine lines inside the tube
                ctx.fillStyle = highlightColor;
                ctx.fillRect(this.x + 4, 0, 6, this.topHeight - lipHeight);
                ctx.fillStyle = darkColor;
                ctx.fillRect(this.x + this.width - 10, 0, 6, this.topHeight - lipHeight);
                
                // Outer Black Stroke Border
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeRect(this.x, -10, this.width, this.topHeight - lipHeight + 10);

                // Draw Top Pipe Flange Edge (The Lip)
                ctx.fillStyle = mainColor;
                ctx.fillRect(this.x - 4, this.topHeight - lipHeight, this.width + 8, lipHeight);
                ctx.fillStyle = highlightColor;
                ctx.fillRect(this.x - 2, this.topHeight - lipHeight, 6, lipHeight);
                ctx.fillStyle = darkColor;
                ctx.fillRect(this.x + this.width - 8, this.topHeight - lipHeight, 6, lipHeight);
                ctx.strokeRect(this.x - 4, this.topHeight - lipHeight, this.width + 8, lipHeight);


                // 2. Draw Bottom Pipe
                const bottomY = canvas.height - this.bottomHeight;
                
                // Draw Bottom Body
                ctx.fillStyle = mainColor;
                ctx.fillRect(this.x, bottomY + lipHeight, this.width, this.bottomHeight - lipHeight);
                ctx.fillStyle = highlightColor;
                ctx.fillRect(this.x + 4, bottomY + lipHeight, 6, this.bottomHeight - lipHeight);
                ctx.fillStyle = darkColor;
                ctx.fillRect(this.x + this.width - 10, bottomY + lipHeight, 6, this.bottomHeight - lipHeight);
                
                // Stroke Border
                ctx.strokeRect(this.x, bottomY + lipHeight, this.width, this.bottomHeight - lipHeight + 10);

                // Draw Bottom Pipe Flange Edge (The Lip)
                ctx.fillStyle = mainColor;
                ctx.fillRect(this.x - 4, bottomY, this.width + 8, lipHeight);
                ctx.fillStyle = highlightColor;
                ctx.fillRect(this.x - 2, bottomY, 6, lipHeight);
                ctx.fillStyle = darkColor;
                ctx.fillRect(this.x + this.width - 8, bottomY, 6, lipHeight);
                ctx.strokeRect(this.x - 4, bottomY, this.width + 8, lipHeight);
            }

            checkCollision(rect) {
                // Responsive circular approximation bounding logic around the bird
                const birdRadius = 13;
                const birdX = rect.x;
                const birdY = rect.y;

                // Check Top Pipe Box Bounds
                const inTopX = birdX + birdRadius > this.x && birdX - birdRadius < this.x + this.width;
                const inTopY = birdY - birdRadius < this.topHeight;
                
                // Check Bottom Pipe Box Bounds
                const bottomPipeY = canvas.height - this.bottomHeight;
                const inBottomY = birdY + birdRadius > bottomPipeY;

                if (inTopX && (inTopY || inBottomY)) {
                    return true;
                }
                return false;
            }
        }

        // Particle System for Feather effects
        let particles = [];
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 5 + 3;
                this.speedX = Math.random() * -3 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.alpha = 1;
                this.color = Math.random() > 0.5 ? '#ffffff' : '#fef08a'; // White and Yellow feather puff particles
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createJumpParticles(x, y) {
            for (let i = 0; i < 6; i++) {
                particles.push(new Particle(x - 5, y + 5));
            }
        }

        // Background scrolling parallax parameters
        let skyOffset = 0;
        let groundOffset = 0;

        function drawBackground() {
            // Horizontal sky background gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#38bdf8'); 
            skyGrad.addColorStop(0.7, '#bae6fd'); 
            skyGrad.addColorStop(1, '#ffedd5'); 
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Cloudscape backdrop (slow scrolling velocity)
            skyOffset -= 0.15;
            if (skyOffset <= -canvas.width) skyOffset = 0;
            
            ctx.fillStyle = '#7dd3fc';
            for (let i = 0; i < 3; i++) {
                const x = skyOffset + (i * 240);
                drawCloudShape(x, canvas.height - 180, 100);
            }

            // Skyline city shapes (mid-level speed scrolling)
            ctx.fillStyle = '#bae6fd';
            for (let i = 0; i < 4; i++) {
                const x = skyOffset * 2.5 + (i * 150) % canvas.width;
                ctx.fillRect(x, canvas.height - 160, 45, 60);
                ctx.fillRect(x + 25, canvas.height - 140, 35, 40);
            }
        }

        function drawCloudShape(x, y, scale) {
            ctx.beginPath();
            ctx.arc(x, y, 30, 0, Math.PI * 2);
            ctx.arc(x + 40, y - 10, 40, 0, Math.PI * 2);
            ctx.arc(x + 80, y, 30, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }

        function drawGround() {
            const groundY = canvas.height - 80;
            
            // Bright green top grass strip
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, groundY, canvas.width, 16);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(0, groundY + 16, canvas.width, 8);

            // Ground scrolling dirt logic
            groundOffset -= PIPE_SPEED;
            if (groundOffset <= -24) groundOffset = 0;

            ctx.fillStyle = '#854d0e'; // Earth brown base
            ctx.fillRect(0, groundY + 24, canvas.width, 56);

            // Isometric pixel art look dirt textures
            ctx.fillStyle = '#713f12'; 
            for (let i = 0; i < canvas.width / 24 + 2; i++) {
                ctx.fillRect(groundOffset + i * 24, groundY + 24, 12, 12);
                ctx.fillRect(groundOffset + i * 24 + 12, groundY + 44, 12, 12);
            }

            // Top borders
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();
        }

        // Output current points score to the viewport center
        function drawScore() {
            if (gameState === 'PLAYING') {
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 6;
                ctx.fillStyle = '#ffffff';
                ctx.font = '24px "Press Start 2P"';
                ctx.textAlign = 'center';
                
                ctx.strokeText(score, canvas.width / 2, 80);
                ctx.fillText(score, canvas.width / 2, 80);
            }
        }

        // Trigger Death logic state
        function gameOver() {
            gameState = 'GAMEOVER';
            playSound('hit');

            // Store high scores inside persistent local client storage
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('flappy_highscore', highscore);
            }

            // Show and render scores on Game Over Overlay panel
            finalScoreLabel.innerText = score;
            highScoreLabel.innerText = highscore;
            gameOverScreen.classList.remove('hidden');
        }

        // Restart configuration levels
        function resetGame() {
            bird.y = 200;
            bird.velocity = 0;
            pipes = [];
            particles = [];
            score = 0;
            frameCounter = 0;
            gameState = 'PLAYING';
            gameOverScreen.classList.add('hidden');
            startScreen.classList.add('hidden');
            initAudio();
        }

        // Main game loop logic
        function gameLoop() {
            drawBackground();

            if (gameState === 'PLAYING') {
                frameCounter++;

                // Spawn pipes inside intervals
                if (frameCounter % PIPE_SPAWN_INTERVAL === 0) {
                    pipes.push(new Pipe());
                }

                // Render, filter & update running obstacle items
                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].update();
                    pipes[i].draw();

                    // Count score point
                    if (!pipes[i].passed && pipes[i].x < bird.x) {
                        pipes[i].passed = true;
                        score++;
                        playSound('score');
                    }

                    // Test collisions
                    if (pipes[i].checkCollision(bird)) {
                        gameOver();
                    }

                    // Clean out passed elements correctly from main pipes list for continuous loop
                    if (pipes[i].x < -pipes[i].width) {
                        pipes.splice(i, 1); // Solves infinite loop crash bug
                    }
                }

                // Apply gravity
                bird.update();

                // Detect floor hit
                if (bird.y + bird.height/2 >= canvas.height - 80) {
                    gameOver();
                }
            } else if (gameState === 'START') {
                // Floating vertical idle motion animation on the lobby screen
                bird.y = 220 + Math.sin(Date.now() * 0.005) * 15;
                bird.frame += 0.15;
            } else if (gameState === 'GAMEOVER') {
                // Ensure gravity still pushes the bird downward to the grass after crashing
                if (bird.y + bird.height/2 < canvas.height - 80) {
                    bird.update();
                }
                // Static render existing pipes
                pipes.forEach(pipe => pipe.draw());
            }

            // Update puff particles
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            bird.draw();
            drawGround();
            drawScore();

            requestAnimationFrame(gameLoop);
        }

        // Trigger action jump event
        function triggerJump() {
            if (gameState === 'PLAYING') {
                bird.jump();
            } else if (gameState === 'START') {
                resetGame();
            }
        }

        // Input Observers (Space bar, touches & clicks)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Lock browser scrolling while hitting space
                triggerJump();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            e.preventDefault();
            triggerJump();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            triggerJump();
        }, { passive: false });

        // Trigger button click bindings
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            resetGame();
        });

        // Load & launch loop sequence
        window.onload = function() {
            gameLoop();
        };
    </script>
</body>
</html>
